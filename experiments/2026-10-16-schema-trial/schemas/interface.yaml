title: interface
type: object
additionalProperties: false
required: [id, status, between, items]
properties:
  id: {$ref: "_common.yaml#/$defs/IFC"}
  status: {$ref: "_common.yaml#/$defs/status"}
  between:
    type: array
    minItems: 2
    maxItems: 2
    items: {oneOf: [{$ref: "_common.yaml#/$defs/PRT"}, {$ref: "_common.yaml#/$defs/EXT"}]}
  parent: {$ref: "_common.yaml#/$defs/IFC"}          # the higher interface it refines
  items:                                             # what flows across it
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [item, from]
      properties:
        item: {$ref: "_common.yaml#/$defs/text"}
        from: {oneOf: [{$ref: "_common.yaml#/$defs/PRT"}, {$ref: "_common.yaml#/$defs/EXT"}]}
  # its requirements point at it with of: IFC
