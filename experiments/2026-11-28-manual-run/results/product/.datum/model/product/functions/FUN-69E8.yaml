id: FUN-69E8
status: agreed
name: "Show recent experience rule results"
definition: "Shows for each covered rule that applies whether it is met, until when or what is missing, the flights counted, strict readings, unsigned items not counted, how current the rules are, and when no result can be given. Covered: LAPL(A) and SPL recent experience including TMG and launch methods, PPL(A) single-engine and TMG rating renewal by experience, and passenger rules including night and one-time requirements. Affected results are withheld while a conflict is unresolved."
