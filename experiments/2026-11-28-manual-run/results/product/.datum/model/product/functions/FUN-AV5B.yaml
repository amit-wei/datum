id: FUN-AV5B
status: agreed
name: "Export the logbook as PDF"
definition: "Produces a readable PDF of the logbook for the pilot to send, print or have signed. Marks what an unresolved conflict affects."
serves: [SCN-WZ70#2, SCN-7T38#3, SCN-5EAZ#2]
inputs:
  - name: "held privileges"
    from: FUN-V4TT
  - name: "recorded starting totals"
    from: FUN-PDMV
  - name: "logbook entry"
    from: FUN-ESPG
  - name: "logbook entry"
    from: FUN-5QA7
  - name: "corrected entry"
    from: FUN-JX7F
  - name: "entry removal"
    from: FUN-2JYW
  - name: "import removal"
    from: FUN-YRV9
  - name: "restored entry"
    from: FUN-SR3A
  - name: "synced records"
    from: FUN-DV8F
  - name: "recorded pilot details"
    from: FUN-82YT
  - name: "conflicting changes"
    from: FUN-DV8F
outputs:
  - name: "logbook PDF"
    to: [pilot, instructor or authority]
