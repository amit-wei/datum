id: FUN-YRV9
status: agreed
name: Undo an import
definition: Takes all entries of a chosen import out of the logbook after the pilot confirms.
serves:
- SCN-2YTZ#2
- SCN-2YTZ#4
inputs:
- name: chosen import and confirmation
  from: pilot
- name: logbook entry
  from: FUN-5QA7
- name: corrected entry
  from: FUN-JX7F
- name: entry removal
  from: FUN-2JYW
- name: restored entry
  from: FUN-SR3A
- name: import record
  from: FUN-5QA7
- name: synced records
  from: FUN-DV8F
outputs:
- name: undo summary
  holds: what will be removed, including entries changed since
  to:
  - pilot
- name: import removal
  holds: which entries the undo took out, as they were
  to:
  - FUN-ESPG
  - FUN-VY4C
  - FUN-6NTH
  - FUN-69E8
