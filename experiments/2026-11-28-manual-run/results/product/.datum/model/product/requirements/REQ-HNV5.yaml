id: REQ-HNV5
status: agreed
pattern: ubiquitous
statement: The part shall limit the failed sign-in attempts it evaluates for one account in
  any hour to {measure}.
measure:
  metric: failed_attempts_per_hour
  definition: Failed attempts evaluated for one account in any 60 minutes.
  unit: attempts
  bounds:
  - statistic: value
    op: ==
    value: 10
rationale: 'Without a limit, sign-in details can be guessed. Access recovery has its own limit,
  so that someone failing sign-in on purpose cannot also block the owner''s recovery. The limit
  was the agent''s proposal. The builder accepted the proposed rules in ELI-SCJS. Value: a judgement
  call with no researched source, accepted by the builder as a starting target (ELI-SCJS#8);
  revisit if testing or running cost gives a reason. No source gives an hourly limit (RES-6SKG);
  the limit only slows guessing, and the total in a row is capped separately, following NIST
  SP 800-63B-4 (RES-6SKG n1).'
of: FUN-B8SK
answers:
- HAZ-9K19
