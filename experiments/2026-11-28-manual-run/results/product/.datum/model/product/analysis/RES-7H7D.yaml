conclusion: |
  Content: FCL.050 and SFCL.050 require a reliable record of all flights in the form the national
  authority sets. The AMC lists differ: aeroplanes/TMG on Part-FCL have a set column format with landings
  and page totals; sailplanes need a suitable format that includes launch method. Dutch law (Regeling
  logboeken) points PPL holders to the EASA aeroplane model and gives gliders a national model (annex 2)
  whose standing beside Part-SFCL is unresolved. LAPL is not named.
  Electronic: allowed by the aeroplane AMC if available on request, complete, certified by the pilot and
  in a format the authority accepts. ILT accepts a file export meeting the AMC1 FCL.050 format. No rule
  or official position on electronic instructor signatures was found. An ILT gliding newsletter (seen as
  a copy) says only the instructor concerned may mark a flight as a training flight in a digital system.
  Sharing: authorities may demand the record without undue delay; SPL holders must also carry enough of
  it to show compliance. Many recency-relevant flights and trainings must be signed by an instructor,
  examiner or head of training. Under Dutch law, entering or allowing false entries, and destroying or
  allowing destruction of the logbook, is forbidden.
  Recency: windows differ by rule. LAPL(A) uses the last 2 years; SEP/TMG revalidation uses the 12 months
  before the rating expiry date and needs a licence endorsement; passengers use 90 days; SPL uses 24
  months, with AMC end-of-month counting for the two training flights; launch methods use 2 years. A
  logbook alone cannot establish that a pilot is permitted to fly.

open_choices:
  - "SPL training-flight window: AMC counts from the end of the flight's month; the rule says 'last 24 months before the planned flight' (stricter if read day to day). Which to show is the builder's choice, or one to confirm with ILT or KNVvL."
  - "No stated method was found for exact day boundaries of '90 days', '24 months' or '2 years' (e.g. whether the same date two years earlier counts, or UTC versus local date). A cautious or lenient reading is a choice."
  - "Signatures: no accepted electronic form was found. The options are to rely on printed pages signed in ink, offer in-app signing without claiming it is accepted, or ask ILT first."
  - "Glider logbook layout: follow AMC1 SFCL.050, Regeling logboeken annex 2, or cover both; ask ILT or KNVvL."
  - "Short-flight grouping is permitted, not required. Whether to offer it is a choice, since it can hide per-flight data that recency needs."
  - "Whether MLA is in scope at all, given that its Dutch rules were not established."
