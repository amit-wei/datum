id: RES-XA6N
date: 2026-11-28
question: >
  What digital pilot logbook solutions exist today that a Netherlands/European pilot of light
  aircraft and/or gliders would use, what do they do, what do they cost, what do users concretely
  complain about, what could be reused or imported from, and where does a gap appear to exist?
narrowed: >
  A survey, not exhaustive. "What they do" means what the vendor's own page says; no product was
  installed or tested. "Complaints" means dated text from Apple's public review feeds and from the
  Dutch gliding forum Zweefportaal. Airline-only products, regulatory rules and technology choices
  are left out. A VERIFIED label on a vendor page means the vendor says it, not that it works.
  A VERIFIED label on a review or post means the person wrote it, not that it is true.
method: >
  Web search; raw fetch of vendor pages and forum threads; Apple RSS customer reviews for 17 searched
  app IDs in the nl, be, de, gb, ie, fr, ch, at, se, dk and us stores (capped, most recent and most
  helpful only). 545 unique reviews returned; 433 after setting aside one app named only "Logbook",
  which was not used. 158 of the 433 are dated 2024 or later. The reviews are mostly of
  general or airline-leaning apps and are not a representative sample.
findings:
  # --- glider and club tools ---
  - n: 1
    claim: >
      GlidingApp (Zweef.app, Dutch/English/German/French) is gliding club administration with a personal
      pilot logbook, EASA/UK SFCL recency, automatic flight recording from OGN FLARM data, and manual
      and bulk-import entry for flights from elsewhere. The vendor calls the logbook legally compliant.
      The pages read did not state an EASA-layout PDF export.
    label: VERIFIED
    source: {title: "GlidingApp, Fly feature page", ref: "https://www.zweef.app/features/fly.html"}
    where: "Personal Pilot Logbook"
    read: full page; also home, demo, comply and pricing pages, and part of the all-features page
    quote: "Automatic flight recording : Automatically populated through OGN flarm data Manual additions and imports : Easily add flights from other clubs or via bulk import"
  - n: 2
    claim: >
      GlidingApp is priced to clubs per active user per month, ex VAT: EUR 0.40 basic, EUR 0.80 with flight
      logbooks and OGN timewriting, EUR 1.10 with finance; billed yearly. A free test account allows up to
      6 users for 12 months. The vendor claims 44 clubs, about 3,400 glider pilots in NL, BE and UK, and
      110,000 flights in 2025 (home page).
    label: VERIFIED
    source: {title: "GlidingApp, Price plan", ref: "https://www.zweef.app/pricing.html"}
    where: "Price plan; the usage figures are on https://www.zweef.app/"
    read: full page
    quote: "Flight Logging Plan € 0.80 per user / month (ex VAT)"
  - n: 3
    claim: >
      Two Dutch users wrote in 2024 that GlidingApp's automatic takeoff and landing times from OGN were
      not fully consistent at their fields; two others in the same thread said it works without errors or
