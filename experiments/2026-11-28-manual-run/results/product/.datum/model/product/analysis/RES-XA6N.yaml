  # --- reuse and gap ---
  - n: 39
    claim: >
      Import and reuse candidates seen in the sources: (a) CSV/spreadsheet with column mapping, offered by
      many products (findings 8, 12, 19, 23, 26); (b) IGC files for date, times and site (8, 13, 14);
      (c) exports from other logbooks (MyFlightbook CSV, Aerolog XLSX, LXNAV Logbook.txt, WeGlide files as
      described by FlightStack); (d) club systems: Vereinsflieger through the pilot's account, as cloudlog
      does (10), and GlidingApp's export (the all-features page lists data import and export; format not
      seen); (e) OGN data or KTrax CSV, limited by coverage, DDB privacy choices and the 24-hour
      redistribution rule (3, 17, 18). No public API terms for Vereinsflieger, GlidingApp, KTrax or WeGlide
      were read, so none of these is established as open to a new product. Open-source logbooks exist
      (14, 28); NinerLog's AGPL-3.0 has obligations that need checking before any reuse.
    label: INFERRED
    source: {title: "Findings 1-28 of this record", ref: "RES-XA6N"}
    where: "as listed"
    read: reasoning
    quote: ""
  - n: 40
    claim: >
      Gap assessment. A general "EASA logbook that does gliders and powered flight" is NOT an empty space:
      several products claim it (10, 12, 26, 28), as do glider-first tools (1, 8, 13) and free options
      (19, 26, 27). Candidate openings, all weakly evidenced: (i) one personal logbook that gathers home-club,
      away and powered flights with little retyping for a Dutch pilot (5 and 7 old; GlidingApp now claims
      most of this for gliders, cloudlog for Vereinsflieger users); (ii) simple entry and dependable offline
      use, import and print on a phone (29-37, mostly general or airline-leaning users); (iii) clear
      mixed glider/TMG/aeroplane handling (only a vendor pitch, 13, was found; no user complaint). No source
      read shows what the builder's friends mean by "clunky", how many Dutch pilots are unserved, or that
      any would pay. For the business case, the evidence for a gap is weak.
