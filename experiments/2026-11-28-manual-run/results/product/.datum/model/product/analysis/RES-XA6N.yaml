conclusion: |
  Many products exist. Glider/Dutch side: GlidingApp (club-bought, EUR 0.80/user/month ex VAT, OGN auto-logging),
  FlightStack (beta, IGC import, no backup commitment), BLANIK (early access), SoarLog, plus flight loggers
  (WeGlide Copilot, SeeYou, KTrax) and club systems (Vereinsflieger, own-built). General logbooks claiming
  gliders include cloudlog.aero (EUR 3.99/7.90 a month), flightlogbook.cloud (EUR 40/year) and AerisLog (free tier);
  MyFlightbook is free and was used by Dutch glider pilots in 2016.
  Dated complaints about apps concern data loss, sync, import, offline, print/export, price, support and dated
  or clunky interfaces, almost all from general or airline-leaning users. No recent user complaint about a
  glider logbook app or about mixed glider/powered logging was found; the one recent glider-specific one is
  about inconsistent automatic OGN times. A gap is not demonstrated.
  Open choices for the builder: whether to position on ease and reliability of the personal logbook, on
  gathering flights from club/IGC/OGN sources, or on mixed glider/powered handling; and which imports the MVP
  carries (CSV is the widest; IGC is the glider-specific one; OGN and club connections have unresolved terms).
