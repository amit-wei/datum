  - n: 7
    question: "Agreed picture. A simple primary logbook for Dutch LAPL(A), PPL(A) and SPL pilots, first version of the builder's business: quick logging with or without signal; past flights by starting totals and CSV; totals; per-rule met / not met with reasons; warnings from entered medical, rating and language expiry dates; PDF export. Out: microlights, unlicensed students, automatic tracking, club connections, IGC, instructor accounts, in-app signing, overall cleared-to-fly. Never: lose or silently change records; give wrong totals, rule results or expiry warnings. Builder alone, small budget, no deadline. Unconfirmed: what friends find clunky; official acceptance, especially gliding. Does this and the six suggestions match?"
    answer: "1) yes 2) yes 3) sure 4) sure 5) yes 6) yes. (Numbered replies to the six suggestions; no separate answer to the picture and no correction to it.)"
