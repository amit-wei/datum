  # ---------- breaches ----------
  - n: 30
    claim: >
      A personal data breach is any security breach leading to accidental or unlawful destruction, LOSS,
      ALTERATION, unauthorised disclosure or access (art. 4(12)). So lost or corrupted logbooks can be
      breaches, not only leaks. The controller notifies the authority without undue delay and where feasible
      within 72 hours of awareness, unless risk is unlikely; late notice needs reasons; information may come
      in phases. A processor tells the controller without undue delay. EVERY breach is documented. The
      people affected are told without undue delay if the risk is likely high, with exceptions (data was
      unintelligible, e.g. encrypted; later measures removed the high risk; disproportionate effort, then a
      public notice).
