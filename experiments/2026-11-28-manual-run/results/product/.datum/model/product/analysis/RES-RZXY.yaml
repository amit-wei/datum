  - n: 36
    claim: >
      Personal data may go outside the EU only under Chapter V: an adequacy decision, or safeguards such as
      standard contractual clauses (with enforceable rights), or narrow art. 49 exceptions. A transfer exists
      when a GDPR-covered controller or processor makes data available to ANOTHER controller or processor in a
      third country. This includes remote access from outside the EU by a processor to data stored in the EU
