id: RES-RZXY
date: 2026-11-28
question: >
  What EU/Dutch data protection duties apply to a one-person business offering an online pilot logbook
  to pilots in the Netherlands, and what must the product DO or never do? Covers data subject rights
  (including erasure, earlier versions and backups), medical certificate expiry dates as health data,
  third parties named in logbooks, lawful basis, breach notification, age limits, and transfers outside
  the EU.
narrowing: >
  Read for functions the product needs and for the hazards behind "private data is exposed" (LOS-MMJ6)
  and retention after deletion (HAZ-7R3N). Left out: technology and hosting provider choice, cookie
  banners beyond the one storage rule (n 38), payments and tax retention, marketing, analytics,
  consumer and contract law other than BW 1:234. Logbook flying rules are in RES-7H7D.
  Not legal advice.
sources_note: >
  GDPR = Regulation (EU) 2016/679, original OJ text from the Publications Office
  (https://publications.europa.eu/resource/celex/32016R0679). UAVG = BWBR0040940, version 2026-09-01
  (repository.officiele-overheidspublicaties.nl). Autoriteit Persoonsgegevens (AP) pages were fetched raw
  on 2026-11-28. EDPB and WP29 PDFs and the Council PDF were turned into text with a home-made script,
  so spacing in their quotes was repaired by hand. EDPB guidance and AP pages are authority positions,
  not legislation.

findings:
  # ---------- scope and roles ----------
  - n: 1
    claim: >
      The household exemption can cover a person's own private activity, but the GDPR still applies to
      whoever provides the means for it. A pilot keeping a private logbook does not take the app provider
      out of the GDPR.
    label: VERIFIED
    source: {title: "GDPR recital 18; art. 2(2)(c)", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: recital 18
    read: the recital and article
    quote: "However, this Regulation applies to controllers or processors which provide the means for processing personal data for such personal or household activities."
  - n: 2
    claim: >
      A controller NOT established in the EU that offers services (free or paid) to people in the EU is
      still covered (art. 3(2)(a)) and must appoint an EU representative in writing (art. 27(1)), unless
      the processing is occasional, has no large-scale special-category data and is unlikely to be a risk
      (art. 27(2)(a)). No record seen says where the builder is established.
    label: VERIFIED
    source: {title: "GDPR art. 3 and 27", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: art. 3(2)(a), 27(1)-(3)
    read: the articles
    quote: "Where Article 3(2) applies, the controller or the processor shall designate in writing a representative in the Union."
  - n: 3
    claim: >
      For pilots' account and logbook data the builder decides purposes and means, so is the controller.
      Any outside service that handles the data for the builder is a processor. For data about people
      NAMED in a logbook, the sources read do not say whether the builder is a controller, or a processor
      for a pilot whose own use is household activity. Treating the builder as controller for them too is
      the cautious reading, and the one findings 20-23 assume. EDPB Guidelines 07/2020 (controller and
      processor) were not read.
    label: INFERRED
    source: {title: "Reasoning from GDPR art. 4(7)-(8), recital 18, and WP242 (n 21)", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: art. 4(7)
    read: the definitions
    quote: "determines the purposes and means of the processing of personal data"

  # ---------- lawful basis, information, accountability ----------
  - n: 4
    claim: >
      Contract (art. 6(1)(b)) covers only processing objectively necessary for the service the pilot asked
      for; useful but unnecessary processing is not covered. INFERRED application: account, logbook,
      history, sync, export and warnings can rest on contract if the service is described to include them.
      Security logging would more naturally rest on legitimate interest (6(1)(f), n 20). The pilot's own
      duty to keep a logbook is not the builder's legal obligation, so 6(1)(c) does not fit logbook content
      (art. 6(1)(c): obligation "to which the controller is subject").
    label: VERIFIED
    source: {title: "EDPB Guidelines 2/2019 on art. 6(1)(b) in online services", ref: "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines-art_6-1-b-adopted_after_public_consultation_en.pdf"}
    where: section on necessity (para 25 onward). The application sentences are INFERRED.
    read: the relevant passages
    quote: "will not cover processing which is useful but not objectively necessary for performing the"
  - n: 5
    claim: >
      At the time data is collected the pilot must be told: who the controller is and how to contact them,
      purposes and legal basis, any legitimate interest, recipients (including processors), transfers
      outside the EU and their safeguard, retention periods or criteria, the rights (access, rectification,
      erasure, restriction, objection, portability), consent withdrawal where relevant, complaint to the
      authority, and whether data is required. It must be concise, clear and plain, "in particular for any
      information addressed specifically to a child" (art. 12(1)).
    label: VERIFIED
    source: {title: "GDPR art. 12(1), 13", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: art. 13(1)-(2)
    read: the articles
    quote: "the period for which the personal data will be stored, or if that is not possible, the criteria used to determine that period"
  - n: 6
    claim: >
      A written record of processing activities is needed even under 250 staff if processing is not
      occasional, is risky, or includes special-category data. A logbook service is not occasional.
      (This is a duty on the business, not a product function.) A DPO is required only in the three cases of
      art. 37(1) (public body; core activity of large-scale regular monitoring; core activity of
      large-scale special-category or criminal data); INFERRED that none fits.
    label: VERIFIED
    source: {title: "GDPR art. 30 and 37; AP, Gezondheidsgegevens gebruiken en delen (quick answer on the register)", ref: "https://www.autoriteitpersoonsgegevens.nl/nl/onderwerpen/gezondheid/medische-gegevens-gebruiken-en-delen"}
    where: art. 30(5), 37(1); AP page, 'verwerkingsregister'
    read: the articles and the page
    quote: "waarvan de verwerking niet incidenteel is"
  - n: 7
    claim: >
      The AP's compulsory-DPIA list includes LARGE-SCALE processing of health data. The list is not
      exhaustive: the AP says to also test the nine EU criteria (two or more is the rule of thumb for doing
      one; sensitive data and vulnerable people such as children are two of them) and to be able to explain
      a decision not to do one. INFERRED: a friends-scale logbook is not on the list by scale, but if
      medical dates count as health data and minors sign up, two criteria could be met. A short written DPIA
      or a written reason for none is needed.
    label: VERIFIED
    source: {title: "AP DPIA list, Stcrt. 2019, 64418; AP page 'Data protection impact assessment (DPIA)'", ref: "https://www.autoriteitpersoonsgegevens.nl/uploads/imported/stcrt-2019-64418.pdf ; https://www.autoriteitpersoonsgegevens.nl/themas/basis-avg/praktisch-avg/data-protection-impact-assessment-dpia"}
    where: list item 7 'Gezondheidsgegevens'; page sections 'DPIA-lijst' and 'De 9 criteria'
    read: item 7 and the page. The 2019 Staatscourant text was read; a later amended version (BWBR0042812) was not checked.
    quote: "Als vuistregel geldt dat u een DPIA moet uitvoeren als uw verwerking aan 2 of meer van deze criteria voldoet."
  - n: 8
    claim: >
      By design and by default only the data needed for each purpose may be processed. This covers the
      amount collected, extent of processing, storage period and accessibility, and by default data must not
      be made accessible to an indefinite number of people without the person acting. Security must fit the
      risk, including confidentiality, integrity, availability, timely restore, and regular testing
      (art. 32(1)); the AP says this starts with a risk analysis and the controller must be able to show it.
    label: VERIFIED
    source: {title: "GDPR art. 25 and 32", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: art. 25(2), 32(1)-(2); AP page 'Maatregelen voor beveiliging' (marked changed November 2026)
    read: the articles and the page
    quote: "That obligation applies to the amount of personal data collected, the extent of their processing, the period of their storage and their accessibility."
  - n: 9
    claim: >
      A processor may be used only with sufficient guarantees and a written (electronic is fine) contract:
      acts only on documented instructions, including on transfers; security; no further sub-processor
      without authorisation; helps with rights requests and breaches; deletes or returns data at the end.
    label: VERIFIED
    source: {title: "GDPR art. 28", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: art. 28(1)-(4), (9)
    read: the article
    quote: "at the choice of the controller, deletes or returns all the personal data to the controller after the end of the provision of services"

  # ---------- rights ----------
  - n: 10
    claim: >
      All rights requests: answer without undue delay and within one month (extendable by two months, with
      notice and reasons inside the first month); free of charge unless manifestly unfounded or excessive;
      if refused, give reasons and the complaint and court routes within one month; the controller must
      facilitate the rights; extra identity information only on reasonable doubt.
    label: VERIFIED
    source: {title: "GDPR art. 12(2)-(6)", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: art. 12
    read: the article
    quote: "without undue delay and in any event within one month of receipt of the request"
  - n: 11
    claim: >
      For a person already signed in, asking for an ID copy is disproportionate; ID copies are generally not
      an appropriate way to authenticate. A download button is an accepted way to give access, but it must
      not narrow what the person gets (anything missing must be supplied another way), and requests sent
      outside the self-service tool must still be handled.
    label: VERIFIED
    source: {title: "EDPB Guidelines 01/2022 on the right of access, v2", ref: "https://www.edpb.europa.eu/system/files/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf"}
    where: paras 73-75 and 138
    read: the relevant paragraphs
    quote: "The use of self-service tools should never limit the scope of personal data received."
  - n: 12
    claim: >
      Access means a copy of ALL personal data being processed about the person, plus the art. 15(1)(a)-(h)
      information (purposes, categories, recipients, retention, rights, complaint, source, automated
      decisions) and transfer safeguards (15(2)), in a commonly used electronic form. INFERRED: the copy
      therefore includes account data, held licences, dates, starting totals, every entry, earlier and
      removed versions still held, import records, and any logs or support mail about the pilot.
    label: VERIFIED
    source: {title: "GDPR art. 15", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: art. 15(1)-(4). The list of product data is INFERRED.
    read: the article
    quote: "The controller shall provide a copy of the personal data undergoing processing."
  - n: 13
    claim: >
      For access, backup data counts. Where a backup holds more or different data than the live system
      (e.g. recently erased, not yet overwritten), the controller must be open about it and, where
      technically feasible, give access to it. A deletion log kept with data minimisation can show this.
    label: VERIFIED
    source: {title: "EDPB Guidelines 01/2022, v2", ref: "https://www.edpb.europa.eu/system/files/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf"}
    where: para 110
    read: the paragraph
    quote: "the controller needs to be transparent about this situation and where technically feasible provide access as requested by the data subject, including to personal data stored in the back-up"
  - n: 14
    claim: >
      Portability (contract or consent basis, automated processing): the person gets the data they provided,
      in a structured, commonly used, machine-readable format, and may pass it on without hindrance. "Provided"
      includes data observed from use, such as activity or access logs; it excludes derived or inferred data
      (the controller's own results). INFERRED: entries, dates, profile and history are in; computed totals
      and rule results need not be (but see access, n 12).
    label: VERIFIED
    source: {title: "GDPR art. 20; WP29 Guidelines on the right to data portability, WP242 rev.01 (endorsed by the EDPB)", ref: "https://ec.europa.eu/newsroom/dae/redirection/document/44099"}
    where: art. 20(1); WP242 section III, pp. 9-11
    read: art. 20; those pages
    quote: "A data controller can exclude those inferred data but should include all other personal data provided by the data subject"
  - n: 15
    claim: >
      A format that hampers automatic extraction is not machine-readable. WP242 gives PDF copies of an email
      inbox as unlikely to be enough, and asks for metadata that preserves meaning. The AP says the same
      format duty is a legal one. INFERRED: the PDF logbook export (FUN-AV5B) alone does not meet
      portability; the data copy (FUN-A60F) must be structured.
    label: VERIFIED
    source: {title: "WP242 rev.01; AP 'Recht op gegevens overdragen (dataportabiliteit)' (text changed March 2026)", ref: "https://www.autoriteitpersoonsgegevens.nl/themas/basis-avg/privacyrechten-avg/recht-op-gegevens-overdragen-dataportabiliteit"}
    where: WP242 section V, pp. 17-18; AP 'Bepaal in welk formaat'
    read: those sections
    quote: "It is unlikely therefore that providing an individual with PDF versions of an email inbox would be sufficiently structured or descriptive"
  - n: 16
    claim: >
      WP29 recommends always telling people about portability BEFORE they close an account. Portability does
      not itself erase anything, and may not be used to delay erasure.
    label: VERIFIED
    source: {title: "WP242 rev.01", ref: "https://ec.europa.eu/newsroom/dae/redirection/document/44099"}
    where: section IV, p. 13
    read: the section
    quote: "data controllers always include information about the right to data portability before data subjects close any account they may have"
  - n: 17
    claim: >
      A person may have inaccurate data about them corrected without undue delay, and incomplete data
      completed, including by a supplementary statement (art. 16); data must be accurate (5(1)(d)) and a
      person may in four cases have processing restricted (art. 18: e.g. accuracy disputed, or objection
      pending), during which it may essentially only be stored. Recipients to whom data was disclosed must
      be told of rectification, erasure or restriction unless impossible or disproportionate (art. 19).
      INFERRED: keeping a superseded version, clearly marked as superseded, can sit with rectification
      when the history has a stated purpose; the current record must be the corrected one. The sources read
      do not address version histories.
    label: VERIFIED
    source: {title: "GDPR art. 5(1)(d), 16, 18, 19", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: the articles. The version-history sentence is INFERRED.
    read: the articles
    quote: "the right to obtain from the controller without undue delay the rectification of inaccurate personal data concerning him or her"
  - n: 18
    claim: >
      Erasure is due without undue delay when, among other grounds, data is no longer needed, consent is
      withdrawn with no other basis, an objection succeeds, processing was unlawful, or data came from an
      online service offered to a child under art. 8(1). Exceptions are limited (art. 17(3)), mainly legal
      obligation on the controller and legal claims. The EDPB says that when a contract ends, processing under
      it generally stops, it is generally unfair to switch to a new basis then, and any retention for legal
      purposes must be identified and announced from the start. Storage may not be longer than necessary
      (art. 5(1)(e)).
    label: VERIFIED
    source: {title: "GDPR art. 17; EDPB Guidelines 2/2019", ref: "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines-art_6-1-b-adopted_after_public_consultation_en.pdf"}
    where: art. 17(1), (3); Guidelines section 2.6, paras 41-44
    read: the article and the section
    quote: "if controllers see a general need to keep records for legal purposes, they need to identify a legal basis for this at the outset of processing, and they need to communicate clearly from the start for how long they plan to retain records"
  - n: 19
    claim: >
      AP: the erasure right covers BACKUPS. On a request the data must be removed as soon as possible from
      all systems and files, backups included. For backups that cannot or can hardly be overwritten, keep
      track of what should have been deleted, and delete it again if the backup is restored. The AP also asks
      for a specific reply (what was deleted, when, from which kinds of system and backup, what was not yet
      deleted, why and when it will be), and says the controller must be able to prove deletion.
    label: VERIFIED
    source: {title: "AP, 'Recht op gegevens verwijderen' (text changed March 2026)", ref: "https://www.autoriteitpersoonsgegevens.nl/themas/basis-avg/privacyrechten-avg/recht-op-gegevens-verwijderen"}
    where: sections 'Verwijder de gegevens ook uit back-ups' and 'Geef een specifieke reactie aan de aanvrager'
    read: full page
    quote: "Back-ups vallen ook onder het verwijderrecht. Krijgt u een verzoek om persoonsgegevens te verwijderen, dan moet u die gegevens dus ook zo snel mogelijk verwijderen uit al uw systemen en bestanden, inclusief uw back-ups."
  - n: 20
    claim: >
      EDPB 2025 coordinated enforcement report (adopted February 2026): it may not always be advisable to
      change backups (their integrity matters), but then there should be procedures to track erasure requests
      and apply them to restored systems. Many controllers had no such procedure. The EDPB says it may give
      more guidance on backups and on "without undue delay" there, so no EU-level time limit is set.
      The report recommends verifying erasure and being able to show it.
    label: VERIFIED
    source: {title: "EDPB, CEF 2025 report on the right to erasure", ref: "https://www.edpb.europa.eu/system/files/2026-02/edpb_cef-report_2025_right-to-erasure_en.pdf"}
    where: section 4.2.6, Issue 6, pp. 20-21
    read: that section
    quote: "organisations should have appropriate procedures to keep track of erasure requests and comply with them on restored systems, as much as possible"

  # ---------- third parties named in logbooks ----------
  - n: 21
    claim: >
      Instructors, examiners, PICs and passengers named in a logbook are data subjects (any information
      about an identifiable person is personal data). Where a service lets a user process others' data for
      personal use, WP29 gives legitimate interest (6(1)(f)) as a possible basis; the service must not use
      that data for its own other purposes, e.g. contacting or marketing to them or building profiles.
      WP29 wrote this about a RECEIVING controller in portability.
    label: VERIFIED
    source: {title: "WP242 rev.01", ref: "https://ec.europa.eu/newsroom/dae/redirection/document/44099"}
    where: section III, third condition, pp. 11-12
    read: the section
    quote: "to provide a service to the data subject that allows the latter to process personal data for a purely personal or household activity"
  - n: 22
    claim: >
      Legitimate interest needs three cumulative things, assessed and documented before processing: a
      legitimate interest, necessity, and the others' rights not overriding it. INFERRED application: PIC name
      and, in set cases, instructor name and signature are required logbook content (RES-7H7D n 2, 4, 7),
      which supports necessity. No source read requires passenger names, so a passenger field is not needed
      and free-text remarks are where passengers' or health details can enter.
    label: VERIFIED
    source: {title: "EDPB Guidelines 1/2024 on legitimate interest (version adopted for consultation, October 2024; no final version was looked for beyond this URL)", ref: "https://www.edpb.europa.eu/system/files/2024-10/edpb_guidelines_202401_legitimateinterest_en.pdf"}
    where: executive summary. The application is INFERRED.
    read: executive summary only
    quote: "For processing to be based on Article 6(1)(f) GDPR, three cumulative conditions must be fulfilled"
  - n: 23
    claim: >
      Data not obtained from the person normally needs an art. 14 notice within one month. It is not due if
      it is impossible or disproportionate effort; then protective measures are needed, including making the
      information public. The AP's example of disproportionate effort is a long search for an address, and it
      says the source of the data must then be recorded. INFERRED: the app holds only a name, so a public
      privacy notice that covers named third parties is the likely route; it should not collect their contact
      details in order to notify them.
    label: VERIFIED
    source: {title: "GDPR art. 14(3), 14(5)(b); AP 'Recht op informatie'", ref: "https://www.autoriteitpersoonsgegevens.nl/themas/basis-avg/privacyrechten-avg/recht-op-informatie"}
    where: art. 14(5)(b); AP 'Onevenredige inspanning'. Application INFERRED.
    read: the article and that section
    quote: "In such cases the controller shall take appropriate measures to protect the data subject's rights and freedoms and legitimate interests, including making the information publicly available"
  - n: 24
    claim: >
      The pilot's own copy may include third parties: the copy and portability rights must not adversely
      affect others (15(4), 20(4)), but a general worry is not enough; harm must be shown in the case, and the
      answer is to redact the part, not to refuse. WP29: records that also concern others (a contact list,
      bank transactions) should be given to the user. INFERRED: the pilot's export keeps PIC, instructor and
      examiner names.
    label: VERIFIED
    source: {title: "EDPB Guidelines 01/2022, v2; WP242 rev.01", ref: "https://www.edpb.europa.eu/system/files/2023-04/edpb_guidelines_202201_data_subject_rights_access_v2_en.pdf"}
    where: Guidelines paras 172-173; WP242 pp. 9, 11
    read: those passages
    quote: "The general concern that rights and freedoms of others might be affected by complying with the request for access, is not enough to rely on Art. 15 (4) GDPR."
  - n: 25
    claim: >
      A named third party has their own rights against a controller: access (art. 15), rectification (16),
      erasure (17), restriction (18), and objection to legitimate-interest processing (21(1)), after which
      processing must stop unless compelling grounds override or legal claims need it. If the controller can
      show it cannot identify the person, art. 11(2) limits arts. 15-20, but it must take extra identifying
      information they offer. INFERRED: the builder needs a way, usable by someone with no account, to receive
      such a request, check identity, find the name, and answer within a month without disclosing the pilot's
      other data. The pilot's duty to keep a correct logbook weighs in the balance, but art. 17(3) has no
      exception worded for another person's legal duty. No source read decides this conflict.
    label: VERIFIED
    source: {title: "GDPR art. 11, 12(2), 15-18, 21(1)", ref: "https://publications.europa.eu/resource/celex/32016R0679"}
    where: the articles. The product consequences are INFERRED.
    read: the articles
    quote: "The controller shall no longer process the personal data unless the controller demonstrates compelling legitimate grounds for the processing which override the interests, rights and freedoms of the data subject"

  # ---------- medical dates / health data ----------
  - n: 26
    claim: >
      Health data is personal data about physical or mental health that reveals health status (art. 4(15)),
      including past, current or FUTURE status, from any source (recital 35). The CJEU reads it broadly: data
      is health data if it can reveal health status by collation or deduction, even if only with some
      probability. A note that a colleague had injured her foot is health data (Lindqvist, C-101/01, paras
      50-51).
    label: VERIFIED
    source: {title: "CJEU C-21/23 Lindenapotheke (4 October 2024); C-101/01 Lindqvist; GDPR recital 35", ref: "https://publications.europa.eu/resource/celex/62023CJ0021"}
    where: C-21/23 the paragraphs on the second question; see also C-184/20 paras 123-127 (https://publications.europa.eu/resource/celex/62020CJ0184)
    read: the relevant paragraphs
    quote: "it is sufficient that they are capable of revealing information about the health status of the data subject by means of an intellectual operation involving collation or deduction"
  - n: 27
    claim: >
      An aviation medical certificate is a fitness assessment, and how long it lasts depends on the class and
      the holder's age (class 2 and LAPL: 60 months under 40, shorter after); certificates can also carry
      limitations (MED.B.001). INFERRED: its expiry date shows that the person held a fitness certificate
      valid to a date, and with the class can hint at age or a gap in fitness. In view of n 26 it should be
      treated as LIKELY health data. NOT SETTLED: no EDPB, AP or court text found speaks about a medical
      certificate's expiry date. The extended web search found only non-official commentary, which did not
      address expiry dates. Language-proficiency and rating expiry dates are not about health.
    label: INFERRED
    source: {title: "Reasoning from Part-MED MED.A.045, MED.B.001 and n 26", ref: "https://www.easa.europa.eu/en/downloads/136679/en"}
    where: MED.A.045(a)(3)-(4), MED.B.001(a)
    read: MED.A.045; start of MED.B.001
    quote: "Class 2 medical certificates shall be valid for a period of"
  - n: 28
    claim: >
      If it is health data, processing is forbidden unless an art. 9(2) condition applies, ON TOP OF an art. 6
      basis. "Necessary for the contract" is not such a condition. The Dutch general exceptions in UAVG art.
      22(2) include explicit consent; UAVG art. 30 exceptions are tied to listed bodies and cases (read in
      part: its first two paragraphs). INFERRED: explicit consent is the realistic condition for an
      individual's logbook app. The other conditions read do not fit.
    label: VERIFIED
    source: {title: "GDPR art. 9; UAVG art. 22(2)(a); EDPB Guidelines 05/2020 on consent, para 99; quoted in Guidelines 2/2019", ref: "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_202005_consent_en.pdf"}
    where: art. 9(1)-(2); UAVG art. 22; consent guidelines para 99
    read: the articles and paragraphs
    quote: "Article 9(2) does not recognize “necessary for the performance of a contract” as an exception to the"
  - n: 29
    claim: >
      Explicit consent needs an express statement (a clear tick or typed confirmation can do), must be
      provable, separate from accepting terms, as easy to withdraw as to give, and freely given: a service
      should not be made conditional on consent for data it does not need. INFERRED: if medical dates are
      kept this way, the field is optional, has its own unticked consent, the rest of the app works without
      it, and withdrawal erases the date everywhere (history, devices, backups as in n 19) and stops warnings
      based on it, saying so, so that a missing warning is not read as "valid".
    label: VERIFIED
    source: {title: "GDPR art. 7; EDPB Guidelines 05/2020", ref: "https://www.edpb.europa.eu/system/files/documents/files/file1/edpb_guidelines_202005_consent_en.pdf"}
    where: art. 7(1)-(4); Guidelines section 3.1.2 and 4. Product design INFERRED.
    read: the article and sections
