conclusion: |
  The GDPR applies to the builder even if each pilot's own use is private. Needed: a stated basis
  (contract for the core service) and a privacy notice; a processing record; processor contracts;
  security by design; every rights request answered within a month; a complete, machine-readable data
  copy (a PDF alone is likely not enough); real erasure, including old versions and backups. The AP says
  to delete from backups as soon as possible; where they cannot be overwritten, track deletions and
  apply them again after a restore. Keeping earlier versions until account deletion is not forbidden by
  anything read, if its purpose is stated, but single items must still be erasable on a valid request.
  Named instructors, examiners, PICs and passengers have their own rights; legitimate interest is the
  likely basis, with a public notice instead of individual notices. A medical expiry date is LIKELY
  health data (inferred, not decided anywhere found); if so it needs explicit consent as an optional,
  withdrawable field. Breaches include loss and alteration: document all, tell the AP within 72 hours
  unless risk is unlikely, tell people if risk is likely high. SPL needs age 16 (student solo 14);
  LAPL/PPL need 17. Licensed users can still be minors. Data may leave the EU only under Chapter V,
  and remote access by a non-EU processor counts.

choices_left_open:
  - "Medical expiry date: treat as health data (optional field with explicit consent, withdrawal and erasure); or leave it out; or take the view it is not health data, which no source read supports."
  - "Minimum age: 16 at sign-up (matches the SPL and keeps under-16 consent rules out); or a higher limit such as 18; or allow younger students with parental consent (also changes the agreed scope, ELI-H7X3#7)."
  - "Backups: remove deleted data from them as soon as possible (AP's main rule); or, where they cannot reasonably be overwritten, let them age out within a short stated period with a deletion record applied after any restore (AP allows this for media that are hard or impossible to overwrite; EDPB says changing backups may not always be advisable). No period is fixed by any source."
  - "Earlier versions: keep until account deletion (current), with a way to purge single items on request; or give them a shorter retention period."
  - "Abandoned accounts: delete after a stated period with notice (risks losing a pilot's only logbook, LOS-7MZV); or keep while the account exists, with a stated reason."
  - "Free-text remarks and names: leave free with a short hint not to enter health or passenger details; or restrict what is stored. No source requires passenger names."
  - "Hosting and support services: EU only with no non-EU access; or allow third-country processors under adequacy or safeguards."
  - "Where the builder is established is a fact to ask, not a choice (n 2)."
