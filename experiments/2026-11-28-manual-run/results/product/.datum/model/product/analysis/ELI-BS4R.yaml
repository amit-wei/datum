    question: "While the app is new, should friends keep their current logbook alongside it? Proposed: yes, until totals have matched and accepted records are confirmed; getting data out is easy."
    answer: "I want the app to be designed to be the real primary logbook."
    need: true
    constraint: true
  - n: 5
    question: "Deadline, monthly budget, and who maintains it? Proposed: just you, a small budget and no fixed date."
    answer: "agreed with your guess."
    constraint: true
    out_of_scope: "No requirement: limits the project (who builds and maintains it, budget, date), not the product's behaviour; synthesis weighs cost and upkeep."
