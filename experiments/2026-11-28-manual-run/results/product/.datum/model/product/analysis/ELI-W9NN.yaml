    question: "Carried to the requirements step (agent's notes from review, not builder answers)."
    answer: "TBD for requirements: minimum age 16 at account creation; privacy notice at the time data is collected; offer the data copy in the deletion warning, and decide what that warning lists; structured data copy with the legally required information, giving away nothing that lets someone sign in; erasure of the medical date also covers retained versions, including versions not chosen in a conflict; failures of storage, sync, update, account actions, deletion and recovery (ELI-C382#8 and entry 8); self-setup (ELI-C382#7); same-date handling applies to all totals (entry 4); unsynced records on a device whose access is ended by changed or recovered sign-in details must not be silently lost."
