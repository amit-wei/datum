id: FUN-N3PF
status: agreed
name: Work out which plants to water today
definition: |
  Decides, from each plant's schedule, its last watering and today's forecast, which
  plants are due for water today and roughly how much water each needs.
serves: [SCN-21VQ#3, SCN-EYDV#3]
inputs:
  - name: plant
    from: FUN-39Z5
  - name: changed plant
    from: FUN-BY64
  - name: removed plant
    from: FUN-E2EJ
  - name: logged watering
    from: FUN-QE1H
  - name: removed watering entry
    from: FUN-VEWS
  - name: forecast for today
    from: FUN-G6AB
  - name: forecast obtained
    from: FUN-G6AB
outputs:
  - name: plants due today
    holds: each plant due and roughly how much water it needs
    to: [FUN-ZYDM]
