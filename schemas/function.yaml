title: function
type: object
additionalProperties: false
required: [id, status, name, definition, inputs, outputs]
properties:
  id: {$ref: "_common.yaml#/$defs/FUN"}
  status: {$ref: "_common.yaml#/$defs/status"}
  name: {$ref: "_common.yaml#/$defs/text"}           # the verb and object
  definition: {$ref: "_common.yaml#/$defs/text"}     # what is done, for whom, with what result
  serves:                                            # the scenario steps it does; a gate requires it at the product
    type: array
    minItems: 1
    items: {$ref: "_common.yaml#/$defs/SCN_step"}
  parent: {$ref: "_common.yaml#/$defs/FUN"}          # the parent part's function it takes on
  inputs:                                            # what it takes; may be empty
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, from]
      properties:
        name: {$ref: "_common.yaml#/$defs/text"}     # a thing someone would name; no type or format
        holds: {$ref: "_common.yaml#/$defs/text"}    # what it contains
        from: {$ref: "_common.yaml#/$defs/text"}     # a function of this part (its ID), or who or what outside the part
  outputs:                                           # what it gives; may be empty
    type: array
    items:
      type: object
      additionalProperties: false
      required: [name, to]
      properties:
        name: {$ref: "_common.yaml#/$defs/text"}
        holds: {$ref: "_common.yaml#/$defs/text"}
        to:                                          # functions of this part (IDs), or who or what outside the part
          type: array
          minItems: 1
          items: {$ref: "_common.yaml#/$defs/text"}
  rationale: {$ref: "_common.yaml#/$defs/text"}      # optional; must not restate links
