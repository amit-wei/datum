# Shared definitions. ID = type prefix + 4 Crockford base32 characters.
# A link to a numbered entry or step adds #n (ELI-3RWN#2, SCN-4M2A#3).
$defs:
  status: {enum: [draft, agreed, retired]}
  FUN: {type: string, pattern: "^FUN-[0-9A-HJKMNP-TV-Z]{4}$"}
  SCN: {type: string, pattern: "^SCN-[0-9A-HJKMNP-TV-Z]{4}$"}
  ELI: {type: string, pattern: "^ELI-[0-9A-HJKMNP-TV-Z]{4}$"}
  SCN_step: {type: string, pattern: "^SCN-[0-9A-HJKMNP-TV-Z]{4}#[1-9][0-9]*$"}
  ELI_entry: {type: string, pattern: "^ELI-[0-9A-HJKMNP-TV-Z]{4}#[1-9][0-9]*$"}
  n: {type: integer, minimum: 1}
  text: {type: string, minLength: 1}
  date: {type: string, pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"}
  commit: {type: string, pattern: "^[0-9a-f]{7,40}$"}
